dimension: credential-model
id: aact:credential-model
question: What secret does the agent present, and who holds it?
terms:
  - id: aact:credential-model/static-secret-in-agent
    label: Static secret held by the agent
    definition: A long-lived API key, password or token is stored where the agent (or its prompt, config or memory) can read it.
    risk_note: Exposed to prompt injection and log leakage; rotation requires redeploying.
  - id: aact:credential-model/vaulted-secret-injected
    label: Vaulted secret, injected at runtime
    definition: The secret lives in a secrets manager and is injected into the agent's runtime, but the agent process can still read it.
  - id: aact:credential-model/brokered-short-lived-token
    label: Brokered short-lived token
    definition: A broker holds the long-lived credential and issues the agent a scoped, expiring token per session or per call.
  - id: aact:credential-model/credential-never-exposed
    label: Credential never exposed to agent
    definition: The agent never receives any usable secret; a gateway attaches credentials to outbound calls after authorization succeeds.
    related: [aact:enforcement-point/gateway]
